{% extends 'dashboard/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<p>آیا مطمئن هستید که می‌خواهید دسته بندی"{{ object }}" را حذف کنید؟</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">حذف</button>
  <a href="{% url 'category_list' %}" class="btn btn-secondary">انصراف</a>
</form>
{% endblock %}
