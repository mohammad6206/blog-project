<!DOCTYPE html>
<html lang="fa"dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}پنل مدیریت{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
  <!-- JQuery + Persian Datepicker JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-date@1.0.6/dist/persian-date.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Persian Datepicker CSS -->

  <style>
    body {
      font-family: Vazirmatn, sans-serif;
    }
    .sidebar {
      min-height: 100vh;
      background-color: #343a40;
    }
    .sidebar a {
      color: #fff;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .navbar {
      background-color: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
    }
    .user-info {
      display: flex;
      align-items: center;
    }
    .user-info i {
      margin-left: 8px;
    }
  </style>
</head>
<body>

<!-- Navbar بالا -->
<nav class="navbar px-4 d-flex justify-content-between align-items-center">
  <div>
    <span class="fw-bold">!به پنل مدیریتی خوش آمدید</span>
  </div>

  <!-- وسط نوار - ساعت و تاریخ با آیکون -->
  <div id="datetime" class="text-center fw-semibold d-flex gap-4 align-items-center" style="font-size: 1rem;">
    <div class="d-flex align-items-center gap-1">
      <i class="fas fa-clock"></i>
      <span id="persianTime"></span>
    </div>
    <div class="d-flex align-items-center gap-1">
      <i class="fas fa-calendar-day"></i>
      <span id="weekday"></span>
    </div>
    <div class="d-flex align-items-center gap-1">
      <i class="fas fa-calendar-alt"></i>
      <span id="persianDate"></span>
    </div>
  </div>

  {% if request.user.is_authenticated %}
  <div class="user-info d-flex align-items-center">
    <i class="fas fa-user me-2"></i>
    <span>{{ request.user.username }}</span>
    <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger ms-3">خروج</a>
  </div>
  {% else %}
  <div>
    <a href="{% url 'login' %}" class="btn btn-sm btn-outline-primary">ورود</a>
  </div>
  {% endif %}
</nav>



<div class="container-fluid">
  <div class="row">
    
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h4 class="text-white text-center py-3">مدیریت</h4>
      <a href="{% url 'dashboard' %}"><i class="fas fa-chart-line me-2"></i>داشبورد</a>
      <a href="{% url 'post_list' %}"><i class="fas fa-newspaper me-2"></i>پست‌ها</a>
      <a href="{% url 'package_list' %}"><i class="fas fa-box-open me-2"></i>پکیج‌ها</a>
      <a href="{% url 'category_list' %}"><i class="fas fa-tags me-2"></i>دسته‌بندی‌ها</a>
      <a href="{% url 'users_list' %}"><i class="fas fa-users me-2"></i>کاربران</a>
    </div>

    <!-- Main content -->
    <div class="col-md-10 p-4">
      {% block content %}{% endblock %}
    </div>
    
  </div>
</div>

</body>

<script>
  const weekdays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];

  function toPersianDigits(number) {
    return number.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  }

  function updateDateTime() {
    const now = new Date();

    // روز هفته فارسی
    const weekday = weekdays[now.getDay()];
    document.getElementById('weekday').innerText = weekday;

    // تاریخ شمسی با intl (سال/ماه/روز)
    const persianDate = new Intl.DateTimeFormat('fa-IR', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).format(now);
    document.getElementById('persianDate').innerText = persianDate;

    // ساعت با ثانیه به شکل فارسی
    const time = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('persianTime').innerText = time;
  }

  setInterval(updateDateTime, 1000);
  updateDateTime();
</script>

</html>
