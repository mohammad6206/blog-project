{% extends 'dashboard/base.html' %}
{% block title %}حذف پیام{% endblock %}
{% block content %}
<h2>حذف پیام</h2>
<p>آیا مطمئن هستید که می‌خواهید پیام فرستاده شده توسط "{{ object.name }}" را حذف کنید؟</p>
<p class="border p-3 bg-light text-break" style="white-space: pre-line;">{{ object.message }}</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">حذف</button>
  <a href="{% url 'contact_message_detail' object.pk%}" class="btn btn-secondary">انصراف</a>
</form>
{% endblock %}
