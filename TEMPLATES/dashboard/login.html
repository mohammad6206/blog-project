<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
	<meta charset="UTF-8">
	<title>ورود به پنل</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap RTL -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
	<!-- Bootstrap JS (با Popper) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

		body {
			font-family: 'Vazirmatn', sans-serif;
			margin: 0;
			padding: 0;
			min-height: 100vh;
			background: linear-gradient(-45deg, #1e3c72, #2a5298, #2980b9, #6dd5fa);
			background-size: 400% 400%;
			animation: gradientBG 10s ease infinite;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		@keyframes gradientBG {
			0% {
				background-position: 0% 50%;
			}

			50% {
				background-position: 100% 50%;
			}

			100% {
				background-position: 0% 50%;
			}
		}

		.login-box {
			background: rgba(255, 255, 255, 0.15);
			border: 1px solid rgba(255, 255, 255, 0.25);
			backdrop-filter: blur(10px);
			border-radius: 16px;
			padding: 40px;
			max-width: 400px;
			width: 100%;
			color: white;
			box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
			animation: fadeIn 1s ease forwards;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(30px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.login-box h4 {
			text-align: center;
			margin-bottom: 30px;
			font-weight: bold;
		}

		.form-control {
			background: rgba(255, 255, 255, 0.2);
			border: none;
			border-radius: 8px;
			color: #fff;
		}

		.form-control::placeholder {
			color: rgba(255, 255, 255, 0.7);
		}

		.form-control:focus {
			background: rgba(255, 255, 255, 0.3);
			box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
		}

		.btn-custom {
			background-color: #ffffff;
			color: #2a5298;
			border: none;
			font-weight: bold;
			transition: all 0.3s ease;
		}

		.btn-custom:hover {
			background-color: #2a5298;
			color: white;
		}

		.link-light a {
			color: #ffffff;
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="login-box">
		<h4>ورود به پنل مدیریت</h4>

		<form method="post">
			{% csrf_token %}
			{% if form.non_field_errors %}
			<div class="alert alert-danger">
				{{ form.non_field_errors }}
			</div>
			{% endif %}

			{% if messages %}
			{% for message in messages %}
			{% if 'login' in message.tags %}
			<div class="alert alert-{{ message.level_tag }} alert-dismissible fade show position-relative text-end"
				role="alert" style="direction: rtl; padding-right: 3rem;">
				{{ message }}
				<button type="button" class="btn-close position-absolute top-50 start-0 translate-middle-y ms-2"
					data-bs-dismiss="alert" aria-label="بستن"></button>
			</div>
			{% endif %}
			{% endfor %}
			{% endif %}

			<div class="mb-3">
				<label for="username" class="form-label">نام کاربری</label>
				<input type="text" name="username" id="username" class="form-control"
					placeholder="نام کاربری را وارد کنید" required>
			</div>

			<div class="mb-3">
				<label for="password" class="form-label">رمز عبور</label>
				<input type="password" name="password" id="password" class="form-control"
					placeholder="رمز عبور را وارد کنید" required>
			</div>

			<button type="submit" class="btn btn-custom w-100 mt-3">ورود</button>
		</form>
	</div>
</body>

</html>
