<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>404 - صفحه پیدا نشد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            text-align: center;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #ff4d4f;
        }

        .message {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        a.button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            color: white;
            background-color: #007bff;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        a.button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5rem;
            }

            .message {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="message">صفحه‌ای که دنبالش بودی پیدا نشد</div>
    <div class="description">ممکنه آدرس رو اشتباه وارد کرده باشی یا صفحه حذف شده باشه.</div>
    <a href="/" class="button">برگشت به صفحه اصلی</a>
</body>
</html>
