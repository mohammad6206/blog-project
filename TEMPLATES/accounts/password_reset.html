{% load static %}
{% load widget_tweaks %}

<link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

<style>
  body {
    background-color: #e7f0fd; /* بک‌گراند روشن آبی روشن */
    color: #212529;
  }
  .center {
    max-width: 400px;
    margin: 50px auto;
  }
  form.card {
    padding: 30px;
    box-shadow: 0 0 15px rgba(100, 100, 255, 0.3); /* سایه آبی ملایم */
    border-radius: 8px;
    background-color: #ffffff; /* سفید */
    transition: box-shadow 0.3s ease;
  }
  form.card:hover {
    box-shadow: 0 0 25px rgba(100, 100, 255, 0.5);
  }
  .form-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  small {
    color: red;
  }
  .form-control {
    background-color: #f8faff;
    color: #212529;
    border: 1px solid #a3bffa; /* حاشیه آبی ملایم */
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .form-control:focus {
    background-color: #ffffff;
    border-color: #6495ed; /* رنگ آبی ملایم */
    box-shadow: 0 0 8px rgba(100, 149, 237, 0.7);
    outline: none;
  }
  .btn-primary {
    background-color: #4caf50; /* سبز */
    border-color: #4caf50;
    transition: background-color 0.3s ease, border-color 0.3s ease;
    color: white;
  }
  .btn-primary:hover {
    background-color: #45a049;
    border-color: #3e8e41;
  }
  .btn-outline-secondary {
    border-color: #6c757d;
    color: #6c757d;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .btn-outline-secondary:hover {
    background-color: #6c757d;
    color: white;
  }
</style>

<div class="center">
    <form method="post" class="card">
        {% csrf_token %}
        <h2 class="text-center mb-4">بازنشانی رمز عبور</h2>
        
        {% for field in form %}
        <div dir="rtl" class="mb-3">
            {{ field.label_tag }}
            {{ field|add_class:"form-control" }}
            {% if field.errors %}
            <small>{{ field.errors|striptags }}</small>
            {% endif %}
        </div>
        {% endfor %}
        
        <div class="form-buttons">
            <input type="submit" value="ارسال" class="btn btn-primary">
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">انصراف</a>
        </div>
    </form>
</div>
