{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ارسال لینک بازیابی رمز عبور</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <!-- اضافه کردن فونت وزیر -->
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background-color: #f0f4ff; /* رنگ بک‌گراند روشن و ملایم */
            color: #212529; /* رنگ متن */
        }

        .container {
            max-width: 480px;
            margin-top: 80px;
        }

        .card {
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff; /* پس‌زمینه کارت سفید */
            color: #212529;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 24px;
            color: #0d6efd; /* رنگ آبی Bootstrap */
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .text-muted {
            color: #6c757d !important;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        a.btn-primary {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card text-center">
            <h2>📩 لینک بازیابی رمز عبور ارسال شد</h2>
            <p>اگر ایمیل وارد شده در سیستم ما ثبت شده باشد، لینک بازیابی رمز عبور به آن ارسال شده است.</p>
            <p class="text-muted">لطفاً ایمیل خود را بررسی کرده و روی لینک ارسالی کلیک کنید.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">بازگشت به صفحه ورود</a>
        </div>
    </div>
</body>

</html>
